name: Test specific isort version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a well-sorted Python file
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/fixtures/py-version"
          cat > "$GITHUB_WORKSPACE/tests/fixtures/py-version/main.py" << 'EOF'
          import os
          import sys

          print(os.getcwd())
          print(sys.version)
          EOF

      - id: action
        uses: .
        with:
          isort-version: "5.13.2"
          configuration: --check-only --diff
          sort-paths: tests/fixtures/py-version

      - name: Assert action succeeded with specific version
        env:
          OUTCOME: ${{ steps.action.outcome }}
          ACTUAL: ${{ steps.action.outputs.isort-result }}
        run: |
          echo "outcome: $OUTCOME"
          echo "isort-result: $ACTUAL"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected isort to succeed on well-sorted imports, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: isort ran successfully with specific version 5.13.2"
