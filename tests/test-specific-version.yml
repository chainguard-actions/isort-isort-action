name: Test specific isort version
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a properly sorted Python file
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/tmp-version"
          cat > "$GITHUB_WORKSPACE/tests/tmp-version/example.py" << 'EOF'
          import os
          import sys
          EOF

      - id: action
        uses: .
        with:
          isortVersion: "5.13.2"
          sortPaths: "tests/tmp-version"
          configuration: "--check-only --diff"

      - name: Assert action succeeded with specific version
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected action to succeed with specific isort version, but outcome was: $OUTCOME"
            exit 1
          fi
          echo "PASS: isort ran successfully with specific version"

      - name: Verify installed isort version
        run: |
          INSTALLED=$(pip3 show isort | grep Version | awk '{print $2}')
          echo "Installed isort version: $INSTALLED"
          if [ "$INSTALLED" != "5.13.2" ]; then
            echo "FAIL: expected isort version 5.13.2 but got $INSTALLED"
            exit 1
          fi
          echo "PASS: correct isort version installed"
