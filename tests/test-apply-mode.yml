name: Test apply mode - sort files in place
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create an unsorted Python file
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/tmp-apply"
          # Write unsorted imports
          printf 'import sys\nimport os\n' > "$GITHUB_WORKSPACE/tests/tmp-apply/to_sort.py"
          echo "Before sorting:"
          cat "$GITHUB_WORKSPACE/tests/tmp-apply/to_sort.py"

      - id: action
        uses: .
        with:
          sortPaths: "tests/tmp-apply"
          # No --check-only, so isort will actually sort the files
          configuration: ""

      - name: Assert action succeeded
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected action to succeed in apply mode, but outcome was: $OUTCOME"
            exit 1
          fi
          echo "PASS: isort apply mode succeeded"

      - name: Assert file was sorted
        run: |
          echo "After sorting:"
          cat "$GITHUB_WORKSPACE/tests/tmp-apply/to_sort.py"
          # After sorting, 'import os' should come before 'import sys'
          FIRST_IMPORT=$(grep -m1 "^import" "$GITHUB_WORKSPACE/tests/tmp-apply/to_sort.py")
          echo "First import: $FIRST_IMPORT"
          if [ "$FIRST_IMPORT" != "import os" ]; then
            echo "FAIL: expected 'import os' to be first after sorting, but got: $FIRST_IMPORT"
            exit 1
          fi
          echo "PASS: file was correctly sorted by isort"
