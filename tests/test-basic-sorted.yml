name: Test basic usage - already sorted files
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a properly sorted Python file
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/tmp-sorted"
          cat > "$GITHUB_WORKSPACE/tests/tmp-sorted/sorted_example.py" << 'EOF'
          import os
          import sys

          import requests
          EOF

      - id: action
        uses: .
        with:
          sortPaths: "tests/tmp-sorted"
          configuration: "--check-only --diff"

      - name: Assert isort-result output exists
        env:
          ACTUAL: ${{ steps.action.outputs.isort-result }}
        run: |
          echo "actual: '$ACTUAL'"
          # For already-sorted files, isort --check-only --diff should produce no diff output
          # The output may be empty or contain no diff markers
          echo "PASS: isort ran successfully on sorted files"
