name: Test basic usage - already sorted imports
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a well-sorted Python file
        run: |
          mkdir -p /tmp/sorted_project
          cat > /tmp/sorted_project/main.py << 'EOF'
          import os
          import sys

          import requests
          EOF

      - id: action
        uses: .
        with:
          isortVersion: latest
          sortPaths: /tmp/sorted_project
          configuration: --check-only --diff

      - name: Assert isort-result output exists
        env:
          ACTUAL: ${{ steps.action.outputs.isort-result }}
        run: |
          echo "isort-result: '$ACTUAL'"
          echo "PASS: isort ran successfully on sorted file"
