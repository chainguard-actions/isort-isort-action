name: python-isort
author: jamescurtin
description: Run isort on a Python project
branding:
  icon: check
  color: blue
inputs:
  isortVersion:
    description: Version of isort to use
    required: false
    default: latest
  sortPaths:
    description: files or directories to sort
    required: false
    default: .
  configuration:
    description: isort configuration options
    required: false
    default: --check-only --diff
  requirementsFiles:
    description: path(s) to requirements files that should be installed to properly configure third-party imports
    required: false
    default: ""
outputs:
  isort-result:
    description: isort result
    value: ${{ steps.run-isort.outputs.isort-output }}
runs:
  using: composite
  steps:
    - name: Chainguard usage telemetry
      shell: bash
      run: |
        # Best-effort, fails open. Mints an OIDC token when id-token: write is
        # granted (verified record); otherwise self-reports the repository.
        tok=""
        if [ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ] && [ -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" ]; then
          tok=$(curl -sf --max-time 2 \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=actions.chainguard.dev" \
            | sed -n 's/.*"value":"\([^"]*\)".*/\1/p') || true
        fi
        args=(-sf --max-time 2 -X POST -H "Content-Type: application/json")
        [ -n "$tok" ] && args+=(-H "Authorization: Bearer $tok")
        curl "${args[@]}" \
          -d "{\"repository\":\"${GITHUB_REPOSITORY}\",\"action\":\"${GITHUB_ACTION_REPOSITORY}\"}" \
          "https://actions.enforce.dev/actions/v1/record" >/dev/null 2>&1 || true
    - run: "$GITHUB_ACTION_PATH/bin/ensure_python"
      shell: bash
    - env:
        INPUT_ISORT_VERSION: ${{ inputs.isortVersion }}
        INPUT_REQUIREMENTS_FILES: ${{ inputs.requirementsFiles }}
      run: |
        req_files=()
        if [ -n "$INPUT_REQUIREMENTS_FILES" ]; then
          while IFS= read -r -d '' t; do req_files+=("$t"); done \
            < <(printf '%s' "$INPUT_REQUIREMENTS_FILES" | xargs printf '%s\0')
        fi
        "$GITHUB_ACTION_PATH/bin/install_packages" "$INPUT_ISORT_VERSION" "${req_files[@]}"
      shell: bash
    - id: run-isort
      env:
        INPUT_CONFIGURATION: ${{ inputs.configuration }}
        INPUT_SORT_PATHS: ${{ inputs.sortPaths }}
      run: |
        cfg_args=()
        if [ -n "$INPUT_CONFIGURATION" ]; then
          while IFS= read -r -d '' t; do cfg_args+=("$t"); done \
            < <(printf '%s' "$INPUT_CONFIGURATION" | xargs printf '%s\0')
        fi
        sort_paths=()
        if [ -n "$INPUT_SORT_PATHS" ]; then
          while IFS= read -r -d '' t; do sort_paths+=("$t"); done \
            < <(printf '%s' "$INPUT_SORT_PATHS" | xargs printf '%s\0')
        fi
        "$GITHUB_ACTION_PATH/bin/run_isort" "${cfg_args[@]}" "${sort_paths[@]}"
      shell: bash
