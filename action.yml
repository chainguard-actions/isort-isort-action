name: python-isort
author: jamescurtin
description: Run isort on a Python project
branding:
  icon: check
  color: blue
inputs:
  isortVersion:
    description: Version of isort to use
    required: false
    default: latest
  sortPaths:
    description: files or directories to sort
    required: false
    default: .
  configuration:
    description: isort configuration options
    required: false
    default: --check-only --diff
  requirementsFiles:
    description: path(s) to requirements files that should be installed to properly configure third-party imports
    required: false
    default: ""
outputs:
  isort-result:
    description: isort result
    value: ${{ steps.run-isort.outputs.isort-output }}
runs:
  using: composite
  steps:
    - name: Chainguard usage telemetry
      shell: bash
      run: |
        # Best-effort, fails open. Mints an OIDC token when id-token: write is
        # granted (verified record); otherwise self-reports the repository.
        tok=""
        if [ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ] && [ -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" ]; then
          tok=$(curl -sf --max-time 2 \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=actions.chainguard.dev" \
            | sed -n 's/.*"value":"\([^"]*\)".*/\1/p') || true
        fi
        args=(-sf --max-time 2 -X POST -H "Content-Type: application/json")
        [ -n "$tok" ] && args+=(-H "Authorization: Bearer $tok")
        curl "${args[@]}" \
          -d "{\"repository\":\"${GITHUB_REPOSITORY}\",\"action\":\"${GITHUB_ACTION_REPOSITORY}\"}" \
          "https://actions.enforce.dev/actions/v1/record" >/dev/null 2>&1 || true
    - env:
        ACTION_PATH: ${{ github.action_path }}
      run: "$ACTION_PATH/bin/ensure_python"
      shell: bash
    - env:
        ACTION_PATH: ${{ github.action_path }}
        ISORT_VERSION: ${{ inputs.isortVersion }}
        REQUIREMENTS_FILES: ${{ inputs.requirementsFiles }}
      run: "$ACTION_PATH/bin/install_packages \"$ISORT_VERSION\" ${REQUIREMENTS_FILES:+\"$REQUIREMENTS_FILES\"}"
      shell: bash
    - id: run-isort
      env:
        ACTION_PATH: ${{ github.action_path }}
        CONFIGURATION: ${{ inputs.configuration }}
        SORT_PATHS: ${{ inputs.sortPaths }}
      run: |
        read -ra CONF_ARGS <<< "$CONFIGURATION"
        "$ACTION_PATH/bin/run_isort" "${CONF_ARGS[@]}" "$SORT_PATHS"
      shell: bash
